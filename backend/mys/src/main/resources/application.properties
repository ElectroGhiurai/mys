spring.application.name=mys
server.port=${PORT:8080}

# ── CORS ──────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://electroghiurai.github.io}

# ── Database (H2 local file / PostgreSQL env override) ────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/mys;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ── Logging ───────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ── JWT ───────────────────────────────────────────────────────────────────
# MUST be ≥ 32 chars (256 bits) for HS256. Override via env variable in production.
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-production}
