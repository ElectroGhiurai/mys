# Override database configurations for running tests in-memory
spring.datasource.url=jdbc:h2:mem:mystest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Clean recreation of tables on every test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# CORS
app.cors.allowed-origins=*

# JWT
app.jwt.secret=test-secret-long-enough-to-be-secure-32-chars
